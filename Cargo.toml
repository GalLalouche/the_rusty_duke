[workspace]
members = [".", "duke_training"]

[package]
name = "duke_rust"
version = "0.1.0"
edition = "2018"

[dependencies]
fstrings = "*"
rand = "*"
paste = "*"
strum = "*"
strum_macros = "*"

log = "*"
backtrace = "*"

minimax-alpha-beta = "0.1.7"
