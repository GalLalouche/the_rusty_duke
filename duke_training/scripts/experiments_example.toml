# Example experiment config for overnight_run.py
#
# Usage:
#   python overnight_run.py experiments_example.toml

[common]
pop = 200
games = 10
sigma = 0.02
lr = 0.02
eval_interval = 25
eval_games = 500
iterations = 100000
time_limit = 3600          # seconds per experiment

# Optional: override the output directory (default: D:/temp/overnight_YYYY-MM-DD)
# output_dir = "D:/temp/my_run"

# ── Experiments ───────────────────────────────────────────────────────────

[[experiments]]
name = "plain_nn_128x32"
args = ["--layers", "128,32"]
dir  = "plain_nn_128x32"

[[experiments]]
name = "guard_nn_32x8"
args = ["--input-features", "guard", "--layers", "32,8"]
dir  = "guard_nn_32x8"

[[experiments]]
name = "cheap_nn_32x8"
args = ["--input-features", "combined", "--layers", "32,8"]
dir  = "cheap_nn_32x8"

[[experiments]]
name = "plain_nn_64x64x64x32"
args = ["--layers", "64,64,64,32"]
dir  = "plain_nn_4layer"

[[experiments]]
name = "plain_nn_32x32x32x16x8"
args = ["--layers", "32,32,32,16,8"]
dir  = "plain_nn_5layer"

[[experiments]]
name = "plain_nn_256x64"
args = ["--layers", "256,64"]
dir  = "plain_nn_wide_2layer"

[[experiments]]
name = "plain_nn_256x128x32"
args = ["--layers", "256,128,32"]
dir  = "plain_nn_wide_3layer"

[[experiments]]
name = "combined_nn_128x32"
args = ["--append-combined", "--layers", "128,32"]
dir  = "combined_nn_128x32"
