[package]
name = "duke_training"
version = "0.1.0"
edition = "2021"

[dependencies]
duke_rust = { path = ".." }
rand = { version = "0.8", features = ["small_rng"] }
strum = "0.24"
burn = { version = "0.16", features = ["wgpu", "autodiff", "ndarray"] }
rayon = "1.10"

[[bin]]
name = "duke_training"
path = "src/main.rs"

[[bin]]
name = "benchmark"
path = "src/benchmark.rs"

[[bin]]
name = "train_heuristic"
path = "src/train_heuristic.rs"

[[bin]]
name = "sweep_lambda"
path = "src/sweep_lambda.rs"

[[bin]]
name = "extract_features"
path = "src/extract_features.rs"

[[bin]]
name = "train_from_trajectories"
path = "src/train_from_trajectories.rs"

[[bin]]
name = "rl_train"
path = "src/rl_train.rs"

[[bin]]
name = "es_train"
path = "src/es_train.rs"

[[bin]]
name = "elo_tournament"
path = "src/elo_tournament.rs"
