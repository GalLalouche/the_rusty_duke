[package]
name = "duke_training"
version = "0.1.0"
edition = "2021"

[dependencies]
duke_rust = { path = ".." }
rand = { version = "0.8", features = ["small_rng"] }
strum = "0.24"
burn = { version = "0.16", features = ["wgpu", "autodiff", "ndarray"] }
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
whr = "0.3"
matrixmultiply = "0.3"

[[bin]]
name = "duke_training"
path = "src/main.rs"

[[bin]]
name = "benchmark"
path = "src/benchmark.rs"

[[bin]]
name = "train_heuristic"
path = "src/train_heuristic.rs"

[[bin]]
name = "sweep_lambda"
path = "src/sweep_lambda.rs"

[[bin]]
name = "extract_features"
path = "src/extract_features.rs"

[[bin]]
name = "train_from_trajectories"
path = "src/train_from_trajectories.rs"

[[bin]]
name = "rl_train"
path = "src/rl_train.rs"

[[bin]]
name = "es_train"
path = "src/es_train.rs"

[[bin]]
name = "elo_tournament"
path = "src/elo_tournament.rs"

[[bin]]
name = "model_registry"
path = "src/model_registry_cli.rs"

[[bin]]
name = "profile_games"
path = "src/profile_games.rs"

[[bin]]
name = "td_selfplay"
path = "src/td_selfplay.rs"

[[bin]]
name = "label_positions"
path = "src/label_positions.rs"

[[bin]]
name = "supervised_train"
path = "src/supervised_train.rs"

[[bin]]
name = "cnn_train"
path = "src/cnn_train.rs"

[[bin]]
name = "supervised_train_cnn"
path = "src/supervised_train_cnn.rs"

[[bin]]
name = "halfda_train"
path = "src/halfda_train.rs"
